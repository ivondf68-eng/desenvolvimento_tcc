<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../css/style.css">
  <title>Cadastrar Conta — Feito A Mão</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <a class="skip-link" href="#form-login">Ir direto para o formulário</a>

  <header class="cabecalho" role="banner">
    <p class="cabecalho__marca"><i class="bi bi-bag-fill"></i> Feito A Mão</p>
    <p class="cabecalho__desc">Marketplace de produtos artesanais alimentícios para microempreendedores locais.</p>
  </header>

  <main class="pagina-login" id="conteudo-principal">
    <div class="card-login" role="region" aria-labelledby="titulo-login">

      <h1 class="card-login__titulo" id="titulo-login">Cadastrar nova conta</h1>
      <p class="card-login__dica">Preencha os campos abaixo para criar sua conta.</p>

      <form class="form-login" id="form-login" aria-label="Formulário de cadastro">

        <div class="campo">
          <div class="campo__rotulo-grupo">
            <label class="campo__rotulo" for="email">E-mail</label>
          </div>
          <input class="campo__entrada" type="email" id="email" name="email" autocomplete="email" placeholder="Digite seu e-mail" required>
        </div>

        <div class="campo">
          <div class="campo__rotulo-grupo">
            <label class="campo__rotulo" for="senha">Senha</label>
          </div>
          <input class="campo__entrada" type="password" id="senha" name="senha" placeholder="Mínimo 6 caracteres" required>
        </div>

        <div class="campo">
          <div class="campo__rotulo-grupo">
            <label class="campo__rotulo" for="cpf">CPF</label>
          </div>
          <input class="campo__entrada" type="text" id="cpf" name="cpf" placeholder="Somente números (11 dígitos)" maxlength="14" required>
        </div>

        <div class="campo">
          <div class="campo__rotulo-grupo">
            <label class="campo__rotulo" for="data_nascimento">Data de Nascimento</label>
          </div>
          <input class="campo__entrada" type="date" id="data_nascimento" name="data_nascimento" required>
        </div>

        <div class="campo">
          <div class="campo__rotulo-grupo">
            <label class="campo__rotulo" for="tipo_perfil">Tipo de Perfil</label>
          </div>
          <select class="campo__entrada" id="tipo_perfil" name="tipo_perfil" required>
            <option disabled value="">Selecione seu tipo de perfil</option>
            <option value="consumidor">Consumidor</option>
            <option value="produtor">Produtor</option>
            <option value="ambos">Consumidor e Produtor</option>
          </select>
        </div>

        <button class="btn-entrar" type="submit" id="btn-entrar">
          <span class="btn-entrar__texto" aria-hidden="true">Cadastrar</span>
        </button>

      </form>

      <p id="mensagem"></p>

      <div class="divisor" aria-hidden="true">ou</div>
      <p class="link-cadastro">
        Já tem conta? <a href="../index.html">Entrar</a>
      </p>

    </div>
  </main>

  <footer class="rodape" role="contentinfo">
    <p>&copy; 2026 <strong>Feito A Mão</strong></p>
  </footer>

  <script src="../api/Cadastro.js"></script>
</body>
</html>
