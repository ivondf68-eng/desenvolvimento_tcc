<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Pedidos — Feito A Mão</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Ir para o conteúdo principal</a>

  <header class="header" role="banner">
    <nav class="nav" aria-label="Navegação principal">
      <a class="nav__logo" href="escolhaPerfil.html"><i class="bi bi-bag-fill"></i> Feito A Mão</a>
      <ul class="nav__menu" id="nav-menu" role="list">
        <li><a href="consumidorMain.html"><i class="bi bi-house"></i> Início</a></li>
        <li><a href="produtores.html"><i class="bi bi-people"></i> Produtores</a></li>
        <li><a href="meusPedidos.html" aria-current="page"><i class="bi bi-bag"></i> Meus Pedidos</a></li>
        <li><a href="../index.html"><i class="bi bi-box-arrow-right"></i> Sair</a></li>
      </ul>
      <div class="nav__acoes">
        <button class="btn-carrinho" id="btn-abrir-carrinho" aria-label="Ver carrinho">
          <i class="bi bi-cart"></i> Carrinho
          <span class="carrinho-badge" id="carrinho-badge">0</span>
        </button>
      </div>
    </nav>
  </header>

  <main class="main" id="conteudo-principal">
    <h1 class="secao-titulo"><i class="bi bi-bag-check"></i> Meus Pedidos</h1>

    <div id="pedidos-consumidor">
      <p>Carregando...</p>
    </div>
  </main>

  <!-- Carrinho drawer -->
  <aside id="carrinho-drawer" class="carrinho-drawer" aria-label="Carrinho de pedidos">
    <div class="carrinho-drawer__cabeca">
      <h2>Seu carrinho</h2>
      <button class="modal__fechar" id="fechar-carrinho" aria-label="Fechar carrinho">✕</button>
    </div>
    <div id="carrinho-grid" class="carrinho-drawer__lista"></div>
    <div class="carrinho-drawer__rodape">
      <p id="carrinho-resumo">0 itens</p>
      <strong id="carrinho-total">R$ 0,00</strong>
      <button class="btn-adicionar" id="finalizar-pedido">Finalizar pedido</button>
    </div>
  </aside>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <footer class="footer" role="contentinfo">
    <p>&copy; 2026 <strong>Feito A Mão</strong></p>
  </footer>

  <script src="../api/Pedido.js"></script>
</body>
</html>
