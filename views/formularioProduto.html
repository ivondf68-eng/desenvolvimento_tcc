<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastrar Produto — Feito A Mão</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Ir para o conteúdo principal</a>

  <header class="header" role="banner">
    <nav class="nav" aria-label="Navegação principal">
      <a class="nav__logo" href="escolhaPerfil.html" aria-label="Feito A Mão — Página inicial">
        <span aria-hidden="true"><i class="bi bi-bag-fill"></i></span> Feito A Mão
      </a>
      <div class="nav__acoes">
        <a href="produtorMain.html" class="btn-carrinho">
          <i class="bi bi-arrow-left"></i> Voltar ao painel
        </a>
      </div>
    </nav>
  </header>

  <main class="main" id="conteudo-principal">
    <section class="perfil-card perfil-card--claro" aria-labelledby="cadastro-produto-title">
      <h1 id="cadastro-produto-title" class="perfil-card__title">Cadastrar novo produto</h1>

      <p id="mensagem-produto"></p>

      <form id="form-produto" class="form-grid" enctype="multipart/form-data">

        <label for="produto-nome">Nome do produto *</label>
        <input id="produto-nome" class="caixa_input" type="text" required />

        <label for="produto-categoria-id">Categoria (ID numérico) *</label>
        <input id="produto-categoria-id" class="caixa_input" type="number" min="1" value="1" required />

        <label for="produto-preco">Preço (R$) *</label>
        <input id="produto-preco" class="caixa_input" type="number" min="0" step="0.01" required />

        <label for="produto-estoque">Estoque *</label>
        <input id="produto-estoque" class="caixa_input" type="number" min="0" value="0" required />

        <label for="produto-imagem">Adicionar imagem</label>
        <input id="produto-imagem" name="imagem" class="caixa_input" type="file" accept="image/*" />

        <label for="produto-descricao">Descrição</label>
        <textarea id="produto-descricao" class="caixa_input" rows="4"></textarea>

        <button type="submit" class="btn-adicionar">Salvar produto</button>
      </form>
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <p>&copy; 2026 <strong>Feito A Mão</strong></p>
  </footer>

  <script src="../api/Produto.js"></script>
</body>
</html>
