<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Feito A Mão — Marketplace de produtos artesanais de microempreendedores locais." />
  <title>Produtores — Feito A Mão</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Ir para o conteúdo principal</a>

  <header class="header" role="banner">
    <nav class="nav" aria-label="Navegação principal">
      <a class="nav__logo" href="escolhaPerfil.html" aria-label="Feito A Mão — Página inicial">
        <span aria-hidden="true"><i class="bi bi-bag-fill"></i></span> Feito A Mão
      </a>

      <button
        class="nav__toggle"
        id="nav-toggle"
        aria-controls="nav-menu"
        aria-expanded="false"
        aria-label="Abrir menu de navegação"
      >
        <span></span><span></span><span></span>
      </button>

      <ul class="nav__menu" id="nav-menu" role="list">
        <li><a href="consumidorMain.html"><i class="bi bi-house"></i> Início</a></li>
        <li><a href="produtores.html"><i class="bi bi-people"></i> Produtores</a></li>
        <li><a href="meusPedidos.html"><i class="bi bi-bag"></i> Meus Pedidos</a></li>
        <li><a href="#" id="btn-sair"><i class="bi bi-box-arrow-right"></i> Sair</a></li>
      </ul>

      <div class="nav__acoes">
        <button class="btn-carrinho" aria-label="Ver carrinho de compras">
          <i class="bi bi-cart"></i> Carrinho
          <span class="carrinho-badge" id="carrinho-badge" aria-label="itens no carrinho">0</span>
        </button>
      </div>
    </nav>
  </header>

  <main class="main" id="conteudo-principal">
    <section class="produtores-header" aria-label="Conheça nossos produtores">
      <div class="produtores-header__texto">
        <h1 class="hero__titulo produtores-cabecalho_titulo">Conheça os produtores</h1>
        <p class="hero__subtitulo produtores-cabecalho_subtitulo">
          Explore os nomes e perfis dos produtores artesanais cadastrados na plataforma.
        </p>
      </div>

      <div class="produtores-header__busca">
        <div class="busca-wrapper" role="search">
          <label for="busca-produtores">Buscar produtores</label>
          <input
            type="search"
            id="busca-produtores"
            class="busca-input"
            placeholder="Buscar produtores..."
            aria-label="Buscar produtores"
            autocomplete="off"
          />
          <button class="busca-btn" aria-label="Realizar busca"><i class="bi bi-search"></i></button>
        </div>
      </div>
    </section>

    <section class="produtores-grid" aria-label="Lista de produtores cadastrados">
      
    </section>
  </main>

  <footer class="footer" role="contentinfo">
    <p>&copy; 2026 <strong>Feito A Mão</strong></p>
  </footer>
  <script src="../js/nav.js"></script>
  <script src="../api/AppConsumidor.js"></script>
  <script src="../api/Produtor.js"></script>
</body>
</html>
