version: "3.9"

services:
  app:
    build: .
    container_name: meu-backend
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: meu_banco
      DB_USER: meu_usuario
      DB_PASSWORD: minha_senha

  db:
    image: postgres:15
    container_name: meu-postgres
    restart: always
    environment:
      POSTGRES_DB: meu_banco
      POSTGRES_USER: meu_usuario
      POSTGRES_PASSWORD: minha_senha
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meu_usuario -d meu_banco"]
      interval: 1m30s
      timeout: 30s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
