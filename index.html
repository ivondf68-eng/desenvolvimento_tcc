<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Entrar — Feito A Mão</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  
</head>
<body>

  <a class="skip-link" href="#form-login">Ir direto para o formulário</a>

  <!-- Cabeçalho -->
  <header class="cabecalho" role="banner">
    <p class="cabecalho__marca"><i class="bi bi-bag-fill"></i> Feito A Mão</p>
    <p class="cabecalho__desc">Marketplace de produtos artesanais alimentícios para microempreendedores locais.</p>
  </header>

  <!-- Conteúdo principal -->
  <main class="pagina-login" id="conteudo-principal_login">
    <div class="card-login" role="region" aria-labelledby="titulo-login">

      <h1 class="card-login__titulo" id="titulo-login">Entrar na sua conta</h1>
      <p class="card-login__dica">Preencha os campos abaixo para acessar.</p>

      <form class="form-login" id="form-login" method="post" aria-label="Formulário de login">

        <!-- Campo E-mail -->
        <div class="campo" id="grupo-email">
          <div class="campo__rotulo-grupo">
            <label class="campo__rotulo" for="email">E-mail</label>
          </div>
          <input class="campo__entrada" type="email" id="email" name="email" autocomplete="email" placeholder="Digite seu e-mail" required>
        </div>

        <!-- Campo Senha -->
        <div class="campo" id="grupo-senha">
          <div class="campo__rotulo-grupo">
            <label class="campo__rotulo" for="senha">Senha</label>
          </div>
          <div class="campo__senha-wrapper">
            <input class="campo__entrada" type="password" id="senha" name="senha" placeholder="Digite sua senha" required>
          </div>
        </div>

        <!-- Esqueci minha senha -->
        <p class="link-senha">
          <a href="#">Esqueci minha senha</a>
        </p>

        <!-- Botão -->
        <button class="btn-entrar" type="submit" id="btn-entrar">
          <span class="btn-entrar__texto" aria-hidden="true">Entrar</span>
        </button>

      </form>

      <p id="mensagem"></p>

      <div class="divisor" aria-hidden="true">ou</div>

      <p class="link-cadastro">
        Ainda não tem conta? <a href="views/cadastrarConta.html">Criar uma conta</a>
      </p>

    </div>
  </main>

  <!-- Rodapé -->
  <footer class="rodape" role="contentinfo">
    <p>&copy; 2026 <strong>Feito A Mão</strong></p>
  </footer>

  <script src="api/Auth.js"></script>
  
</body>
</html>
